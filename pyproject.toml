[project]
name = "chihiro-airlines"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "chainlit>=1.3.0",
    "anthropic>=0.40.0",
    "tavily-python>=0.5.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
